<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Moodify - Recommendation</title>

    <link rel="stylesheet" href="css/favorit.css">
</head>

<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">

            <a href="recommendation.html">
