<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Moodify - Home Page</title>

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/home.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <div id="navbar"></div>



    <!-- MAIN -->

    <main class="container">


        <!-- MOOD HEADER -->

        <section class="mood-header">

            <div class="mood-icon">
                😊
            </div>


            <div>

                <h1>
                    How was your day
                    <span id="username"></span>?
                </h1>


                <p>
                    Please choose your mood below to get recommendation song
                </p>

            </div>

        </section>



        <!-- MOOD LISTS -->

        <section>

            <div class="section-title">

                <div>

                    <p class="small-title">
                        MOOD LISTS
                    </p>


                    <!-- LIST OF MOOD -->

                    <div
                        id="moodContainer"
                        class="mood-container"
                    >
                    </div>

                </div>

            </div>

        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script src="js/navbar.js"></script>

    <script src="js/home.js"></script>


</body>

</html>
